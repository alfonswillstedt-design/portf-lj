# Carl-Gustafs konfiguration. Ändra fritt – allt läses in vid varje körning.

startkapital_sek: 100000
databas: data/carl.db

# --- Avgifter (ungefär som Avanza) ---
avgifter:
  courtage_procent: 0.25        # procent av affärsvärdet
  courtage_min_sek: 1.0         # minsta courtage per affär
  valutavaxling_procent: 0.25   # påslag när affären görs i annan valuta än SEK
  laneranta_procent_ar: 6.0     # årsränta på lånade pengar (hävstång), räknas per dag
  blankningsavgift_procent_ar: 3.0  # årsavgift på värdet av blankade positioner, räknas per dag

# --- Likvidation (margin call) ---
likvidation:
  # Positionen stängs automatiskt när kvarvarande säkerhet understiger
  # denna andel av positionens värde.
  underhallsmarginal_procent: 5.0

# --- Konkurs ---
# Om det totala kontovärdet faller under denna gräns räknas det som konkurs
# (med så lite pengar går det inte längre att handla vettigt).
konkursgrans_sek: 100

# --- Prisdata ---
priser:
  max_alder_minuter_aktier: 60   # varning om priset är äldre än så under öppettid
  timeout_sekunder: 10

# Krypto handlas BARA via ETP:er på Stockholmsbörsen (som vanliga aktier), precis som
# i tävlingen. Exempel på tickers (fler kan finnas – sök med price.py):
krypto_etp:
  BITCOIN-XBT.ST: Bitcoin Tracker One (SEK)
  ETHEREUM-XBT.ST: Ether Tracker One (SEK)
  VALOUR-BTC-0-SEK.ST: Valour Bitcoin Zero (SEK)
  VALOUR-ETH-0-SEK.ST: Valour Ethereum Zero (SEK)
  VALOUR-SOL-SEK.ST: Valour Solana (SEK)

# Fonder och ETF:er (börshandlade fonder). Används för att gruppera innehav på dashboarden.
# Allt som inte står här eller under krypto_etp räknas som aktie.
fonder_etf:
  QQQ: Invesco QQQ (Nasdaq-100)
  SMH: VanEck Semiconductor ETF
  SPY: SPDR S&P 500 ETF
  XACT-OMXS30.ST: XACT OMXS30
  XACT-NORDEN.ST: XACT Norden
  GLD: SPDR Gold Shares (guld-ETF)

# --- Börser: öppettider i lokal tid ---
# Ticker-suffix avgör vilken börs en aktie hör till. Inget suffix = USA.
borser:
  stockholm:  {namn: Stockholm,  suffix: [".ST"], tidszon: Europe/Stockholm,   oppnar: "09:00", stanger: "17:30"}
  helsingfors: {namn: Helsingfors,suffix: [".HE"], tidszon: Europe/Helsinki,    oppnar: "10:00", stanger: "18:30"}
  kopenhamn:  {namn: Köpenhamn,  suffix: [".CO"], tidszon: Europe/Copenhagen,  oppnar: "09:00", stanger: "17:00"}
  oslo:       {namn: Oslo,       suffix: [".OL"], tidszon: Europe/Oslo,        oppnar: "09:00", stanger: "16:20"}
  usa:        {namn: USA (NYSE/Nasdaq), suffix: [""], tidszon: America/New_York, oppnar: "09:30", stanger: "16:00"}

# Helgdagar då börserna är stängda (ÅÅÅÅ-MM-DD). Fyll på vid behov.
helgdagar:
  stockholm: ["2026-12-24", "2026-12-25", "2026-12-26", "2026-12-31", "2027-01-01", "2027-01-06"]
  usa:       ["2026-11-26", "2026-12-25", "2027-01-01", "2027-01-18", "2027-02-15"]

# --- Bevakningslista för indicators.py --lista (Carl letar möjligheter här, men får handla allt) ---
bevakningslista:
  stockholm: [ABB.ST, ALFA.ST, ASSA-B.ST, ATCO-A.ST, AZN.ST, BOL.ST, ERIC-B.ST, ESSITY-B.ST, EVO.ST,
              HEXA-B.ST, HM-B.ST, INVE-B.ST, NDA-SE.ST, NIBE-B.ST, SAAB-B.ST, SAND.ST, SEB-A.ST,
              SHB-A.ST, SKF-B.ST, SWED-A.ST, TELIA.ST, VOLV-B.ST, EPI-A.ST, ADDT-B.ST, LIFCO-B.ST,
              INDU-C.ST, SCA-B.ST, SKA-B.ST, TEL2-B.ST, GETI-B.ST]
  norden: [NOVO-B.CO, DSV.CO, NOKIA.HE, NESTE.HE, EQNR.OL, DNB.OL]
  usa: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, AMD, JPM, LLY, NFLX, PLTR]
  krypto_etp: [BITCOIN-XBT.ST, ETHEREUM-XBT.ST]
  # KANDIDATLISTAN: aktier/fonder vi pratat om. Gås igenom FÖRST varje session. Nya fynd läggs till här.
  kandidater: [SAAB-B.ST, SEB-A.ST, ATCO-A.ST, MYCR.ST, SWED-A.ST, SHB-A.ST, ABB.ST, VOLV-B.ST, EQNR.OL,
               NOVO-B.CO, BITCOIN-XBT.ST, NVDA, META, AAPL, MSFT, AMD, MU, QQQ, SMH,
               CAMX.ST, NOD.OL, HANZA.ST, KOG.OL, ADDT-B.ST, SKA-B.ST, GLD, BOOZT.ST]
  # Mindre kända bolag (mid/small cap, First North, nischade USA-bolag) – leta här varje session.
  dolda: [MYCR.ST, BIOA-B.ST, SECT-B.ST, BETS-B.ST, NCAB.ST, SDIP-B.ST, CAMX.ST, HANZA.ST, MTRS.ST,
          TRUE-B.ST, XVIVO.ST, NOTE.ST, KOG.OL, NOD.OL, NKT.CO, CRDO, ALAB, VRT, RKLB, HIMS, AXON, IONQ]
